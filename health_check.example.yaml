# Disk usage, % of the disk in use
disk:
  default:
    warning: 75
    critical: 90
  # Optional: own thresholds for some disks
  # disks:
  #   /var:
  #     warning: 70
  #     critical: 85
  # Optional: disks that are not checked
  # ignore:
  #   - /mnt/backup

# Memory in use, % of total (everything except MemAvailable)
memory:
  warning: 80
  critical: 90

# CPU load: 15-minute load average per CPU, in % (100 = all CPUs busy)
load:
  warning: 100
  critical: 200

# CPU temperature, degrees Celsius (sensor x86_pkg_temp); skipped if there is no sensor
temperature:
  warning: 85
  critical: 95

# Laptop battery charge, %; lower is worse, so warning is greater than critical.
# Skipped if there is no battery (desktops, virtual machines, WSL)
battery:
  warning: 20
  critical: 10

# Optional: checks for services.
# A service with a url gets an HTTP GET request:
# 200-399 is OK; any other status or no answer within 5 seconds is CRITICAL.
# A service with a host and a port gets a TCP connection (for SSH, databases
# and other services without HTTP): OK if it connects within 5 seconds.
# Real addresses and ports go only into your local health_check.yaml, not into Git.
# services:
#   - name: my-app
#     url: http://localhost:8080/health
#   - name: my-db
#     host: localhost
#     port: 5432
