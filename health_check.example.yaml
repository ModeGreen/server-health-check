# Disk usage, % of the disk in use
disk:
  default:
    warning: 75
    critical: 90
  # Optional: own thresholds for some disks
  # disks:
  #   /var:
  #     warning: 70
  #     critical: 85
  # Optional: disks that are not checked
  # ignore:
  #   - /mnt/backup

# Memory in use, % of total (everything except MemAvailable)
memory:
  warning: 80
  critical: 90

# CPU load: 15-minute load average per CPU, in % (100 = all CPUs busy)
load:
  warning: 100
  critical: 200

# Optional: HTTP checks for services, a GET request to each url.
# 200-399 is OK; any other status or no answer within 5 seconds is CRITICAL.
# Real addresses go only into your local health_check.yaml, not into Git.
# services:
#   - name: my-app
#     url: http://localhost:8080/health
